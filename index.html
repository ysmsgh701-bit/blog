<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4060 블로그 수익화 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
        }

        header {
            padding: 4rem 2rem;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .post-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .post-card:hover {
            border-color: var(--secondary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .post-date {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .post-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Blog Pipeline</h1>
        <p style="color: var(--text-muted)">4060 세대를 위한 수익형 자동화 시스템</p>
    </header>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalPosts">0</div>
                <div class="stat-label">누적 포스팅</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">3</div>
                <div class="stat-label">신규 제안 주제</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">금일 SNS 배포</div>
            </div>
        </div>

        <h2 style="margin-bottom: 2rem;">포스팅 히스토리</h2>
        <div class="post-list" id="postList">
            <!-- JavaScript will populate this -->
        </div>
    </div>

    <footer>
        &copy; 2026 Smart Blog Pipeline. All rights reserved.
    </footer>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('data/posts_db.json');
                const posts = await response.json();
                
                // 역순으로 정렬 (최신순)
                posts.sort((a, b) => b.id - a.id);

                // 통계 업데이트
                document.getElementById('totalPosts').innerText = posts.length;
                
                const postList = document.getElementById('postList');
                postList.innerHTML = ''; // 초기화

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-content">
                            <span class="post-category">${post.category || '일반'}</span>
                            <div class="post-title">${post.title}</div>
                            <div class="post-date">${post.date}</div>
                            <div class="post-actions">
                                <button class="btn btn-primary" onclick="viewPost(${post.id})">본문 보기</button>
                                <button class="btn btn-secondary" onclick="viewSNS(${post.id})">SNS 콘텐츠</button>
                            </div>
                        </div>
                    `;
                    postList.appendChild(card);
                });
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('postList').innerHTML = '<p>데이터를 불러오는데 실패했습니다. (data/posts_db.json 확인 필요)</p>';
            }
        }

        function viewPost(id) {
            window.open(`data/post_${id}.html`, '_blank');
        }

        function viewSNS(id) {
            window.open(`data/sns_${id}.json`, '_blank');
        }

        // 초기 로드
        loadDashboard();
    </script>
</body>
</html>
